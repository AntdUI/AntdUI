name: Question
description: When you don't understand how to use a certain feature, you can submit the issue
labels: ["question"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        :warning: Before submitting:
        - Read the [Document](https://github.com/AntdUI/AntdUI/blob/main/doc/wiki/en/Home.md) and search existing issues to see whether someone else has already asked the same question.
        - If an existing feature is failing, throwing exceptions, or rendering incorrectly, use the **Bug** template.
        - If the capability you need does not exist yet, use the **Enhancement** template.

  - type: input
    attributes:
      label: Version
      description: Please enter the version number you are using.
      placeholder: E.g. 1.0.5, or daily Commit ID
    validations:
      required: true
  - type: textarea
    id: net_sdk
    attributes:
      label: .NET version
      description: What is the version of .NET, use `dotnet --info`.
    validations:
      required: true
  - type: textarea
    attributes:
      label: OS
      description: E.g. Windows 11, Operating system type and version
    validations:
      required: true
  - type: textarea
    attributes:
      label: What is your question?
      description: |
        Please describe your question clearly and specifically. The following information helps you get an accurate answer faster:
        - What you are trying to achieve
        - Your current code or configuration (key code snippets are recommended)
        - The expected result and the actual result
        - What you have already tried
      placeholder: |
        Goal: ...
        Current code: ...
        Expected: ...
        Actual: ...
        Tried: ...
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        🙏 I promise to communicate with mutual respect, understanding, and friendliness to jointly maintain a good community atmosphere.