name: 使用疑问
description: 当你不明白某个功能如何使用时，可以提交该Issue。
title:
labels: ["问题"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先：
        - 阅读 [Wiki文档](https://gitee.com/AntdUI/AntdUI/wikis) 并搜索是否已有重复 [问题](https://gitee.com/AntdUI/AntdUI/issues)
        - 已有功能异常/报错，请使用「问题反馈（BUG）」模板
        - 项目尚未提供的能力，请使用「功能建议」模板
  - type: input
    attributes:
      label: 版本号
      description: 请输入您使用的版本号。
      placeholder: 例如：1.0.5，请不要填写“最新”等干扰描述，源码可填写提交id
    validations:
      required: true
  - type: textarea
    id: net_sdk
    attributes:
      label: .NET version
      description: .NET SDK的版本。NET，cmd 执行 `dotnet --info`。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 操作系统
      description: 例如：Windows 11，操作系统类型和版本
    validations:
      required: true
  - type: textarea
    attributes:
      label: 你的问题是什么？
      description: |
        请清晰、具体地描述你的疑问。附上以下信息能让你更快得到有效回答：
        - 你想实现的目标
        - 目前的写法或配置（建议附上关键代码）
        - 期望的结果与实际的结果
        - 已经尝试过的方式
      placeholder: |
        我想实现：...
        目前的写法：...
        期望结果：...
        实际结果：...
        已尝试：...
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        🙏 我承诺将本着相互尊重、理解和友善的态度进行交流，共同维护好良好的社区氛围。