name: 功能建议
description: 对本项目提出一个功能建议
title:
labels: ["增强"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Issue 不是许愿池**。提交前请先确认你的诉求属于 **纯 UI 界面库范畴**。

        ### ✅ 属于本库范畴（会被认真评估）
        - 现有控件的能力增强：新增属性 / 事件 / 方法、完善交互、补充样式与主题适配
        - 新增**纯 UI** 控件（按钮、输入、表格、弹窗、加载、布局等）
        - 现有控件的 DPI、RTL、触屏、无障碍、明暗主题适配改进
        - 纯视觉 / 布局绘制能力（Canvas、SVG、Emoji 文本渲染、圆角、阴影等）
        - API 易用性改进（命名、默认值、重载），前提是**不引入额外依赖**

        ### ❌ 不属于本库范畴（会被直接关闭）
        - **需要引入庞大依赖或与 UI 无关的依赖**：浏览器内核（CefSharp / WebView2 封装）、ORM / 数据库驱动、消息队列、日志框架、序列化、音视频编解码、加解密、网络协议栈、AI 推理等
        - **掺杂 UI 之外的逻辑**：HTTP 请求、文件传输、数据访问、业务计算、账号体系等。AntdUI **完全没有实现任何 HTTP 请求**，只提供可被外部实现的 API 对接点
        - **.NET 生态已有更专业方案**的领域：例如浏览器，外部库已经做得更好，不需要 AntdUI 再做一层美化适配

        ### 为什么这样划线
        AntdUI 的定位是**纯粹的 UI 界面库**：只负责外观、布局、交互与主题适配，不掺杂 UI 之外的逻辑，也不接受任何需要庞大依赖组成的特性。这样才能保证体积、可维护性与升级稳定性。

        > 提交前请先搜索 [已有 Issue](https://gitee.com/AntdUI/AntdUI/issues)，重复建议会被关闭。
  - type: textarea
    id: background
    attributes:
      label: 背景和动机
      description: |
        请说明这个能力解决什么问题、在什么场景下使用，以及目前是如何绕过的（自定义绘制 / 第三方库 / 不支持）。
        如果该能力需要引入第三方库，请明确说明库名称、体积与授权方式，便于评估是否属于本库范畴。
      placeholder: 目的 + 使用场景 + 现有替代方案
    validations:
      required: true
  - type: textarea
    attributes:
      label: 要求
      description: |
        请具体描述期望的 API 形态与行为（属性 / 事件 / 方法、参数与默认值、与现有控件的差异），并说明是否属于跨主题 / 跨 DPI / 跨语言的通用能力。
        如有参考实现（其他 UI 库的效果截图或伪代码）请一并提供。
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        🙏 我承诺将本着相互尊重、理解和友善的态度进行交流，共同维护好良好的社区氛围。